# ============================================================
# AIDG & KR System — local development stack
# Usage: docker compose up --build
# Services: postgres (+pgvector), redis, minio (S3), api
# ============================================================
name: aidg-kr

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aidg
      POSTGRES_PASSWORD: aidg
      POSTGRES_DB: aidg
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidg -d aidg"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    env_file:
      - .env
    environment:
      AIDG_DATABASE_URL: postgresql+asyncpg://aidg:aidg@db:5432/aidg
      AIDG_REDIS_URL: redis://redis:6379/0
      AIDG_S3_ENDPOINT: http://minio:9000
    command: >
      sh -c "alembic upgrade head &&
             python -m app.db.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
